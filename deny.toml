# Vérification des dépendances : `cargo deny check` (https://github.com/EmbarkStudios/cargo-deny).

[graph]
# Les plateformes visées : les dépendances des autres (macOS, Android…) ne sont pas vérifiées.
targets = ["x86_64-pc-windows-gnu", "x86_64-unknown-linux-gnu"]

[licenses]
# Licences compatibles avec l'AGPL 3.0 de la visionneuse (imposée par le décodeur `heic`). Une
# dépendance sous plusieurs licences au choix (« Apache-2.0 OR GPL-2.0-only »…) est acceptée si
# l'une d'elles l'est.
allow = [
    "0BSD",
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[advisories]
# Failles connues (base RustSec, téléchargée à chaque vérification).
yanked = "deny"
ignore = [
    # paste n'est plus maintenu (dépôt archivé), sans faille connue. Il ne sert qu'à la
    # compilation (macros) du décodeur AV1, et aucune version de celui-ci ne s'en passe.
    { id = "RUSTSEC-2024-0436", reason = "macros de compilation du décodeur AV1, sans faille connue" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
# Uniquement crates.io.
unknown-registry = "deny"
unknown-git = "deny"
